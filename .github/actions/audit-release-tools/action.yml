name: Audit release tools
description: Check the release dependency tree against npm advisories
inputs:
  install:
    description: Install the locked tools and verify their signatures before auditing
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24.22.2'
        package-manager-cache: false

    - name: Install and verify locked release tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        npm ci
        npm audit signatures

    - name: Audit for high and critical advisories
      shell: bash
      env:
        NPM_CONFIG_PACKAGE_LOCK_ONLY: ${{ inputs.install != 'true' }}
      run: npm audit --audit-level=high
