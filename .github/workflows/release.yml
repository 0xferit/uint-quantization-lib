name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry or backfill
        required: false
        type: string

permissions:
  contents: read

env:
  PUBLISHED_REF: refs/tags/soldeer-published

concurrency:
  group: library-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Release validated sources
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: bash scripts/plan-release.sh

      - uses: ./.github/actions/setup-foundry
        if: steps.plan.outputs.prepare == 'true' || steps.plan.outputs.pending_tag != ''

      - uses: ./.github/actions/audit-release-tools
        if: steps.plan.outputs.prepare == 'true'
        with:
          install: 'true'

      - name: Install Solidity dependencies
        if: steps.plan.outputs.prepare == 'true'
        run: |
          forge soldeer install
          git diff --exit-code -- soldeer.lock

      - name: Classify Solidity changes
        id: bump
        if: steps.plan.outputs.prepare == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bump=$(bash scripts/analyze-bump.sh "$RUNNER_TEMP/solidity.diff")
          printf 'type=%s\n' "$bump" >> "$GITHUB_OUTPUT"

      - name: Prepare, validate and release
        id: semantic
        if: steps.plan.outputs.prepare == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ steps.bump.outputs.type }}
        run: node_modules/.bin/semantic-release

      - name: Verify selected tag and archive its revision
        id: archive
        if: &selected_tag ${{ steps.semantic.outputs.tag || steps.plan.outputs.pending_tag }}
        env:
          TAG: *selected_tag
        run: |
          git fetch origin --tags
          release_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          release_dir=$(mktemp -d)
          git archive "$release_commit" | tar -x -C "$release_dir"
          grep -Fx "    string internal constant VERSION = \"${TAG#v}\";" "$release_dir/src/UintQuantizationLib.sol"
          {
            printf 'commit=%s\n' "$release_commit"
            printf 'path=%s\n' "$release_dir"
          } >> "$GITHUB_OUTPUT"
          marker=$(git rev-parse -q --verify "$PUBLISHED_REF" || :)
          if [[ -n "$marker" ]] && [[ "$(git rev-parse "$marker^{commit}")" == "$release_commit" ]]; then
            exit 0
          fi
          if [[ -z "$marker" ]] || git merge-base --is-ancestor "$marker^{commit}" "$release_commit"; then
            printf 'advance_marker=true\nprevious_marker=%s\n' "$marker" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$release_commit" "$marker^{commit}"; then
            echo 'The Soldeer publication marker and release tag have unrelated histories.' >&2
            exit 1
          fi

      - name: Validate the existing release revision
        if: steps.plan.outputs.pending_tag != ''
        working-directory: ${{ steps.archive.outputs.path }}
        run: |
          forge soldeer install
          forge build
          forge test -vvv

      - name: Recover missing GitHub release
        if: steps.plan.outputs.pending_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.pending_tag }}
          HISTORICAL: ${{ steps.plan.outputs.historical }}
        run: |
          if ! gh release view "$TAG" --json tagName >/dev/null; then
            args=(--verify-tag --generate-notes)
            if [[ "$HISTORICAL" == true ]]; then
              args+=(--latest=false)
            fi
            gh release create "$TAG" "${args[@]}"
          fi

      - name: Upload and verify Soldeer package
        if: steps.archive.outputs.commit != ''
        working-directory: ${{ steps.archive.outputs.path }}
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
          TAG: *selected_tag
        run: python3 "$GITHUB_WORKSPACE/scripts/publish-soldeer.py" "${TAG#v}"

      - name: Record successful Soldeer publication
        if: steps.archive.outputs.advance_marker == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.archive.outputs.commit }}
          PREVIOUS_MARKER: ${{ steps.archive.outputs.previous_marker }}
        run: |
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' \
            push --force-with-lease="$PUBLISHED_REF:$PREVIOUS_MARKER" origin "$RELEASE_COMMIT:$PUBLISHED_REF"

      - name: Report remaining Solidity changes
        if: steps.plan.outputs.follow_up == 'true'
        run: |
          echo '::error::Recovered the pending release. Run Release on main again to publish the remaining Solidity changes.'
          exit 1
