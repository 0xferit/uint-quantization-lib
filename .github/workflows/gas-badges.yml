name: Gas Badges

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gas-badges
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    outputs:
      staking_bps: ${{ steps.metrics.outputs.staking_bps }}
      extreme_bps: ${{ steps.metrics.outputs.extreme_bps }}
      exact_gas: ${{ steps.metrics.outputs.exact_gas }}
      strict_gas: ${{ steps.metrics.outputs.strict_gas }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
      - run: forge soldeer install
      - id: metrics
        shell: bash
        run: |
          forge test --match-path test/showcase/ShowcaseGas.t.sol -vv | tee gas_output.txt
          metric() {
            local value
            value=$(awk -F ': ' -v label="$2" '$1 == "  " label {print $2}' gas_output.txt)
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing or ambiguous metric: $2" >&2; return 1; }
            echo "$1=$value" >> "$GITHUB_OUTPUT"
          }
          metric staking_bps 'staking strict savings bps'
          metric extreme_bps 'extreme strict savings bps'
          metric exact_gas 'staking exact uint112 gas'
          metric strict_gas 'staking strict gas'

  publish:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select badge branch
        shell: bash
        run: |
          badge_ref=$(git ls-remote --heads origin refs/heads/gh-badges)
          if [[ -n "$badge_ref" ]]; then
            git fetch --depth=1 origin gh-badges
            git switch -c gh-badges FETCH_HEAD
          else
            git switch --orphan gh-badges
          fi
      - name: Write badge data
        env:
          STAKING_BPS: ${{ needs.measure.outputs.staking_bps }}
          EXTREME_BPS: ${{ needs.measure.outputs.extreme_bps }}
          EXACT_GAS: ${{ needs.measure.outputs.exact_gas }}
          STRICT_GAS: ${{ needs.measure.outputs.strict_gas }}
        shell: bash
        run: |
          mkdir -p .badges
          badge() {
            jq -n --arg label "$2" --arg message "$3" \
              '{schemaVersion: 1, label: $label, message: $message, color: "blue"}' > ".badges/$1.json"
          }
          percent() {
            awk -v bps="$1" -v basis_points_per_percent=100 \
              'BEGIN { printf "%.1f%%", bps / basis_points_per_percent }'
          }
          badge staking-savings 'strict stake vs raw uint128' "$(percent "$STAKING_BPS")"
          badge extreme-savings '12 slots to 1' "$(percent "$EXTREME_BPS")"
          badge staking-equal-range 'stake gas: exact uint112 / strict uint96' "$EXACT_GAS / $STRICT_GAS"
      - name: Publish badge data
        run: |
          git add .badges
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update gas badges'
            git push origin HEAD:gh-badges
          fi
